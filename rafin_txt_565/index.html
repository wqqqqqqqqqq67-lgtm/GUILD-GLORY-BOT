<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06070e">
<title>ASIF BK | Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
:root{--bg:#06070e;--s1:#0d0f1b;--s2:#121528;--s3:#1a1e36;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.16);--text:#eef0fc;--dim:#8a90b0;--violet:#8b5cf6;--blue:#3b82f6;--cyan:#22d3ee;--ok:#34d399;--warn:#fbbf24;--err:#f87171;--accent1:#8b5cf6;--accent2:#3b82f6;--grad:linear-gradient(135deg,var(--accent1),var(--accent2));--ease:.25s cubic-bezier(.2,.8,.2,1);--tab-h:64px;--anim-dur:1s}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2a2f58;border-radius:8px}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 520px at 12% -8%,rgba(139,92,246,.2),transparent 60%),radial-gradient(800px 520px at 100% 108%,rgba(59,130,246,.18),transparent 60%),var(--bg);transition:background 1s ease}
.bg::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0%,#000,transparent 70%)}
.app{display:flex;height:100vh;height:100dvh}
.shell{flex:1;min-width:0;display:flex;flex-direction:column}
.content{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:clamp(18px,3vw,32px);padding-bottom:calc(var(--tab-h) + 32px + env(safe-area-inset-bottom))}
.page{display:none;max-width:1180px;margin:0 auto}.page.active{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.sidebar{display:none;width:252px;flex-shrink:0;flex-direction:column;padding:22px 14px;border-inline-end:1px solid var(--line);background:rgba(10,12,24,.72);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px;margin-bottom:28px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-size:17px;flex-shrink:0;box-shadow:0 8px 22px rgba(99,102,241,.4);transition:background 1s ease,box-shadow 1s ease}
.brand b{display:block;font-size:17px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;transition:background 1s ease}
.brand small{display:block;color:var(--dim);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:12px;color:var(--dim);font-weight:600;font-size:14px;text-align:start;border:1px solid transparent;transition:var(--ease)}
.nav-item i{width:20px;text-align:center;font-size:15px}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nav-item.active{color:#fff;background:rgba(139,92,246,.14);border-color:rgba(139,92,246,.35)}
.nav-item.active i{color:var(--cyan)}
.nav-item.team i{color:var(--ok)}
.side-foot{display:flex;align-items:center;gap:10px;padding:14px 10px 0;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px}
.side-foot b{margin-inline-start:auto;color:var(--ok)}
.topbar{display:flex;align-items:center;gap:10px;padding:10px clamp(14px,3vw,32px);padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:rgba(8,9,20,.74);backdrop-filter:blur(16px);flex-shrink:0}
.brand-m{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.brand-m span{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;transition:background 1s ease}
.brand-m .logo{width:34px;height:34px;border-radius:10px;font-size:14px}
.crumb{display:none;align-items:center;gap:8px;color:var(--dim);font-weight:600;font-size:13px}.crumb b{color:var(--text)}
.top-right{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:8px;height:38px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:var(--s1);font-size:12px;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:ping 2s infinite;flex-shrink:0}
.pill.off .dot{background:var(--err);animation:none}
@keyframes ping{70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom));min-height:var(--tab-h);background:rgba(8,9,20,.9);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tabbar[hidden]{display:none}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 2px;border-radius:12px;color:var(--dim);font-size:10.5px;font-weight:600;transition:var(--ease)}
.tab i{font-size:17px}.tab.team i{color:var(--ok)}
.tab.active{color:#fff;background:rgba(139,92,246,.16)}.tab.active i{color:var(--cyan)}
@media(min-width:900px){.sidebar{display:flex}.tabbar{display:none}.brand-m{display:none}.crumb{display:flex}.content{padding-bottom:40px}}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.page-title{font-size:clamp(23px,3.6vw,30px);font-weight:800;letter-spacing:-.3px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;transition:background 1s ease}
.page-sub{color:var(--dim);margin-top:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--s2);font-weight:700;font-size:13px;transition:var(--ease);white-space:nowrap}
.btn:hover{border-color:var(--line2);background:var(--s3);transform:translateY(-1px)}
.btn:disabled{opacity:.55;pointer-events:none}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(99,102,241,.35);transition:background 1s ease,box-shadow 1s ease}
.btn.ok{background:linear-gradient(135deg,#34d399,#10b981);border-color:transparent;color:#03150e}
.btn.danger{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.4);color:#fecaca}
.btn.on{background:rgba(139,92,246,.16);border-color:rgba(139,92,246,.4);color:#fff}
.spin{animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.glow{position:relative;background:var(--s1);border:1px solid var(--line);border-radius:18px;transition:border-color var(--ease),transform var(--ease)}
.glow:hover{border-color:var(--line2);background-image:radial-gradient(380px circle at var(--mx,50%) var(--my,50%),rgba(139,92,246,.13),transparent 60%)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.stat{padding:20px}.stat-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.stat-icon{width:38px;height:38px;border-radius:11px;background:rgba(139,92,246,.14);color:var(--cyan);display:grid;place-items:center;font-size:15px;transition:background 1s ease,color 1s ease}
.stat-label{color:var(--dim);font-weight:600;font-size:13px}
.stat-val{font-family:'JetBrains Mono',monospace;font-size:clamp(26px,3vw,32px);font-weight:700;letter-spacing:-.5px;word-break:break-all;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;transition:background 1s ease}
.stat-foot{margin-top:8px;color:var(--cyan);font-size:12.5px;font-weight:600;transition:color 1s ease}
.dist{margin-top:14px;padding:20px}.dist h3{font-size:14px;font-weight:700;margin-bottom:14px}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.06);gap:2px}
.bar i{display:block;height:100%;transition:width .6s ease,background 1s ease}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px}
.legend span{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12.5px;font-weight:600}
.legend b{color:var(--text);font-family:'JetBrains Mono',monospace}.legend em{width:9px;height:9px;border-radius:3px;display:block;transition:background 1s ease}
.c-match{background:var(--cyan)}.c-online{background:var(--ok)}.c-paused{background:#7b819f}.c-error{background:var(--warn)}
.controls{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;position:relative}
.search i{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}
.search input{width:100%;height:42px;padding:0 14px 0 40px;border-radius:12px;border:1px solid var(--line);background:var(--s1);outline:none;transition:var(--ease)}
.search input:focus{border-color:var(--accent1);box-shadow:0 0 0 3px rgba(139,92,246,.18)}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--s1);border:1px solid var(--line);overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;color:var(--dim);font-size:12.5px;font-weight:700;white-space:nowrap;transition:var(--ease)}
.seg button:hover{color:#fff}.seg button.active{color:#fff;background:var(--grad);box-shadow:0 6px 16px rgba(99,102,241,.4);transition:background 1s ease}
.seg .n{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:11px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.node{padding:18px;overflow:hidden}.node:hover{transform:translateY(-2px)}
.node-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.who{display:flex;align-items:center;gap:13px;min-width:0}
.ava{position:relative;width:58px;height:58px;flex-shrink:0;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--accent1),var(--accent2),var(--cyan) calc(var(--p,0)*1%),rgba(255,255,255,.09) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));transition:background 1s ease}
.ava-in{width:46px;height:46px;border-radius:50%;background:var(--s3);display:grid;place-items:center;color:var(--cyan);font-size:18px}
.lvl{position:absolute;inset-inline-end:-6px;bottom:-4px;padding:1px 6px;border-radius:7px;font-size:10px;font-weight:800;font-family:'JetBrains Mono',monospace;background:var(--grad);border:2px solid var(--s1);transition:background 1s ease}
.who-t{min-width:0}.name{display:flex;align-items:center;gap:8px;min-width:0;font-weight:700;font-size:15px}
.nick{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.region{padding:1px 7px;border-radius:6px;font-size:10px;font-weight:800;color:#c4b5fd;background:rgba(139,92,246,.16);border:1px solid rgba(139,92,246,.3);flex-shrink:0}
.uid{display:flex;align-items:center;gap:6px;margin-top:2px;color:var(--dim);font-family:'JetBrains Mono',monospace;font-size:11.5px}
.mini{width:24px;height:24px;border-radius:7px;color:var(--dim);display:grid;place-items:center;font-size:11px;transition:var(--ease)}.mini:hover{color:#fff;background:rgba(255,255,255,.1)}
.badge{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;font-size:11px;font-weight:800;border:1px solid;flex-shrink:0;white-space:nowrap}
.s-online{color:var(--ok);background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.3)}
.s-match{color:var(--cyan);background:rgba(34,211,238,.1);border-color:rgba(34,211,238,.4)}
.s-search{color:#c4b5fd;background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.35)}
.s-paused{color:var(--dim);background:rgba(138,144,176,.1);border-color:rgba(138,144,176,.3)}
.s-error{color:var(--warn);background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.3)}
.s-match i{animation:blink 1.6s infinite}@keyframes blink{50%{opacity:.35}}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.metric{padding:10px;border-radius:11px;background:rgba(255,255,255,.035);border:1px solid var(--line);min-width:0}
.metric span{display:block;color:var(--dim);font-size:11px;font-weight:600;margin-bottom:2px}
.metric strong{display:block;font-family:'JetBrains Mono',monospace;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.metric.gain strong{color:var(--ok)}
.prog-top,.prog-bot{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--dim);font-weight:600;font-family:'JetBrains Mono',monospace}
.prog-bot{margin-top:6px}.pct{color:var(--cyan);font-weight:700;transition:color 1s ease}
.track{height:7px;margin-top:7px;background:rgba(255,255,255,.07);border-radius:9px;overflow:hidden}
.fill{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--accent1),var(--accent2),var(--cyan));transition:width .8s ease,background 1s ease}
.node-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.time{display:inline-flex;align-items:center;gap:7px;color:var(--dim);font-size:12px;font-family:'JetBrains Mono',monospace}
.acts{display:flex;gap:6px}
.act{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--dim);display:grid;place-items:center;font-size:13px;transition:var(--ease)}
.act:hover{color:#fff;border-color:var(--accent1);background:rgba(139,92,246,.15)}
.act.danger:hover{color:var(--err);border-color:var(--err);background:rgba(248,113,113,.1)}
.empty{grid-column:1/-1;text-align:center;padding:56px 16px;color:var(--dim)}
.empty i.big{display:block;font-size:30px;margin-bottom:14px;color:var(--accent1);transition:color 1s ease}
.empty .btn{margin:18px 5px 0}
.term{display:flex;flex-direction:column;height:clamp(340px,calc(100dvh - 330px),760px);border-radius:18px;border:1px solid var(--line);background:#070815;overflow:hidden}
.term-head{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--s1);font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--cyan);transition:color 1s ease}
.dots{display:flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:#f87171}.dots i:nth-child(2){background:#fbbf24}.dots i:nth-child(3){background:#34d399}
.cnt{margin-inline-start:auto;color:var(--dim)}
.term-body{flex:1;overflow-y:auto;padding:14px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7;color:#d4d7f5}
.log{display:flex;gap:10px;padding:1px 6px;border-radius:6px;word-break:break-word}.log:hover{background:rgba(255,255,255,.04)}
.log-ts{color:var(--accent1);flex-shrink:0;transition:color 1s ease}
.log-msg.success{color:var(--ok)}.log-msg.warning{color:var(--warn)}.log-msg.error{color:var(--err)}.log-msg.info{color:#7dcfff}
.term-empty{color:var(--dim);padding:20px 6px}
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(3,4,14,.75);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity var(--ease),visibility var(--ease)}
.modal.active{opacity:1;visibility:visible}
.sheet{position:relative;width:100%;max-width:460px;max-height:92dvh;overflow-y:auto;background:var(--s1);border:1px solid var(--line2);border-radius:22px;padding:26px;transform:translateY(24px) scale(.97);transition:transform var(--ease);box-shadow:0 40px 100px rgba(0,0,0,.65)}
.sheet::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad);transition:background 1s ease}
.modal.active .sheet{transform:none}
.sheet h2{font-size:21px;font-weight:800;margin-bottom:6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;transition:background 1s ease}
.sheet p.lead{color:var(--dim);margin-bottom:20px}
.field{margin-bottom:16px}.field label{display:block;font-size:12.5px;font-weight:700;color:var(--cyan);margin-bottom:7px;transition:color 1s ease}
.field input,.field select,.field textarea{width:100%;padding:12px 13px;border-radius:11px;background:var(--bg);border:1px solid var(--line);outline:none;font-size:14px;transition:var(--ease)}
.field textarea{min-height:110px;resize:vertical;font-family:'JetBrains Mono',monospace;font-size:12.5px}
.field select option{background:#0d1030}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent1);box-shadow:0 0 0 3px rgba(139,92,246,.18)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
@media(max-width:600px){.modal{align-items:flex-end;padding:0}.sheet{max-width:none;border-radius:22px 22px 0 0;padding-bottom:max(26px,env(safe-area-inset-bottom))}.two{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.metric:last-child{grid-column:1/-1}.pill span{display:none}.pill{width:38px;padding:0;justify-content:center}.page-head .row,.page-head .row .btn{width:100%}.page-head .row .btn{flex:1}}
.toasts{position:fixed;inset-inline:16px;bottom:16px;z-index:400;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.toast{max-width:min(420px,100%);display:flex;align-items:center;gap:11px;padding:12px 16px;border-radius:13px;font-weight:600;font-size:13px;background:rgba(14,16,40,.97);border:1px solid var(--line2);border-inline-start:4px solid var(--accent1);box-shadow:0 12px 32px rgba(0,0,0,.5);pointer-events:auto;animation:tin .3s var(--ease) both;transition:border-color 1s ease}
.toast.success{border-inline-start-color:var(--ok)}.toast.error{border-inline-start-color:var(--err)}
.toast.hide{opacity:0;transform:translateY(8px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(12px)}}
@media(max-width:899px){.toasts{bottom:calc(var(--tab-h) + 14px + env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<!-- MASTER PASSWORD LOGIN GATE -->
<div id="loginGate" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(3,4,14,.98);backdrop-filter:blur(14px);padding:16px">
  <div style="width:100%;max-width:400px;background:#0d0f1b;border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:32px 28px;text-align:center;box-shadow:0 40px 100px rgba(0,0,0,.75);position:relative">
    <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(135deg,#8b5cf6,#3b82f6);border-radius:22px 22px 0 0"></div>
    <div style="width:70px;height:70px;margin:0 auto 20px;border-radius:20px;background:linear-gradient(135deg,#8b5cf6,#3b82
